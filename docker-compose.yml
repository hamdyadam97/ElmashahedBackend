version: '3.8'

services:
  # ==========================================
  # Django Application
  # ==========================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: edu_system_web
    restart: unless-stopped
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
      - ./.env:/app/.env:ro
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///app/db.sqlite3}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL}
    ports:
      - "8000:8000"
    networks:
      - edu_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==========================================
  # Nginx Reverse Proxy
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: edu_system_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./cert.crt:/etc/nginx/ssl/cert.crt:ro
      - ./cert.key:/etc/nginx/ssl/cert.key:ro
    depends_on:
      - web
    networks:
      - edu_network

  # ==========================================
  # PostgreSQL Database (Optional)
  # ==========================================
  # Uncomment below section to use PostgreSQL instead of SQLite
  #
  # db:
  #   image: postgres:15-alpine
  #   container_name: edu_system_db
  #   restart: unless-stopped
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   environment:
  #     - POSTGRES_DB=${DB_NAME:-edu_system}
  #     - POSTGRES_USER=${DB_USER:-postgres}
  #     - POSTGRES_PASSWORD=${DB_PASSWORD:-changeme}
  #   networks:
  #     - edu_network
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-edu_system}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # ==========================================
  # Redis Cache (Optional)
  # ==========================================
  # redis:
  #   image: redis:7-alpine
  #   container_name: edu_system_redis
  #   restart: unless-stopped
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - edu_network

# ==========================================
# Volumes
# ==========================================
volumes:
  static_volume:
  media_volume:
  logs_volume:
  # postgres_data:
  # redis_data:

# ==========================================
# Networks
# ==========================================
networks:
  edu_network:
    driver: bridge
